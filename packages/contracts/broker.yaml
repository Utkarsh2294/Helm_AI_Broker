  "components": {
    "schemas": {
      "Action": {
        "properties": {
          "scenario": {
            "type": "string",
            "enum": [
              "happy",
              "decline",
              "late",
              "arithmetic",
              "medical",
              "duplicate",
              "referral",
              "injection"
            ],
            "title": "Scenario",
            "default": "happy"
          },
          "medical_released": {
            "type": "boolean",
            "title": "Medical Released",
            "default": false
          },
          "ranking_id": {
            "type": "string",
            "title": "Ranking Id",
            "default": ""
          },
          "selected": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 3,
            "title": "Selected"
          },
          "survey": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Survey"
              },
              {
                "type": "null"
              }
            ]
          },
          "acknowledgements": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Acknowledgements"
          },
          "suitability": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 20000
              },
              {
                "type": "null"
              }
            ],
            "title": "Suitability"
          },
          "pack_hash": {
            "type": "string",
            "title": "Pack Hash",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "Action"
      },
      "CoverageNeed": {
        "properties": {
          "level": {
            "type": "integer",
            "maximum": 3.0,
            "minimum": 0.0,
            "title": "Level"
          },
          "importance": {
            "type": "number",
            "maximum": 1.0,
            "exclusiveMinimum": 0.0,
            "title": "Importance",
            "default": 1
          },
          "must_have": {
            "type": "boolean",
            "title": "Must Have",
            "default": false
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "level"
        ],
        "title": "CoverageNeed"
      },
      "Credentials": {
        "properties": {
          "email": {
            "type": "string",
            "maxLength": 200,
            "title": "Email",
            "default": "broker@helm.demo"
          },
          "password": {
            "type": "string",
            "maxLength": 256,
            "minLength": 1,
            "title": "Password"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "password"
        ],
        "title": "Credentials"
      },
      "DNR": {
        "properties": {
          "request_id": {
            "type": "string",
            "title": "Request Id"
          },
          "version": {
            "type": "integer",
            "title": "Version",
            "default": 1
          },
          "needs": {
            "$ref": "#/components/schemas/Needs"
          },
          "facts": {
            "additionalProperties": {
              "$ref": "#/components/schemas/Fact"
            },
            "type": "object",
            "title": "Facts"
          },
          "medical_items": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Medical Items"
          },
          "vulnerability_flags": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Vulnerability Flags"
          },
          "missing": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Missing"
          },
          "hypotheses": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Hypotheses"
          },
          "consent_to_share": {
            "type": "boolean",
            "title": "Consent To Share"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "request_id",
          "needs",
          "facts",
          "medical_items",
          "vulnerability_flags",
          "missing",
          "hypotheses",
          "consent_to_share"
        ],
        "title": "DNR"
      },
      "EditDNR": {
        "properties": {
          "dnr": {
            "$ref": "#/components/schemas/DNR"
          },
          "reason": {
            "type": "string",
            "maxLength": 500,
            "minLength": 3,
            "title": "Reason"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "dnr",
          "reason"
        ],
        "title": "EditDNR"
      },
      "Fact": {
        "properties": {
          "value": {
            "title": "Value"
          },
          "confidence": {
            "type": "number",
            "maximum": 1.0,
            "minimum": 0.0,
            "title": "Confidence",
            "default": 1
          },
          "source": {
            "type": "string",
            "title": "Source"
          },
          "verified_by": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Verified By"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "value",
          "source"
        ],
        "title": "Fact"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "Needs": {
        "properties": {
          "budget_annual_pence": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Budget Annual Pence",
            "default": 180000
          },
          "hard_budget_cap": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Hard Budget Cap"
          },
          "priorities": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Priorities"
          },
          "coverage": {
            "additionalProperties": {
              "$ref": "#/components/schemas/CoverageNeed"
            },
            "type": "object",
            "title": "Coverage"
          },
          "hospital_level": {
            "type": "integer",
            "maximum": 3.0,
            "minimum": 1.0,
            "title": "Hospital Level",
            "default": 2
          },
          "preferred_underwriting": {
            "type": "string",
            "title": "Preferred Underwriting",
            "default": "moratorium"
          },
          "allowed_underwriting": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Allowed Underwriting"
          },
          "reference_low_pence": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Reference Low Pence",
            "default": 60000
          },
          "reference_high_pence": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Reference High Pence",
            "default": 400000
          }
        },
        "additionalProperties": false,
        "type": "object",
        "title": "Needs"
      },
      "QuoteRequest": {
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 100,
            "minLength": 1,
            "title": "Id"
          },
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1,
            "title": "Name"
          },
          "cover_type": {
            "type": "string",
            "enum": [
              "individual",
              "couple",
              "family"
            ],
            "title": "Cover Type",
            "default": "individual"
          },
          "postcode_district": {
            "type": "string",
            "maxLength": 10,
            "title": "Postcode District",
            "default": "M20"
          },
          "needs": {
            "$ref": "#/components/schemas/Needs"
          },
          "consent_to_share": {
            "type": "boolean",
            "title": "Consent To Share",
            "default": true
          },
          "medical_items": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 30,
            "title": "Medical Items"
          },
          "vulnerability_flags": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Vulnerability Flags"
          },
          "missing_fields": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Missing Fields"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "id",
          "name"
        ],
        "title": "QuoteRequest"
      },
      "StepUp": {
        "properties": {
          "password": {
            "type": "string",
            "maxLength": 256,
            "minLength": 1,
            "title": "Password"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "password"
        ],
        "title": "StepUp"
      },
      "SuitabilityEdit": {
        "properties": {
          "text": {
            "type": "string",
            "maxLength": 20000,
            "minLength": 20,
            "title": "Text"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "text"
        ],
        "title": "SuitabilityEdit"
      },
      "Survey": {
        "properties": {
          "thumbs": {
            "additionalProperties": {
              "type": "string",
              "enum": [
                "up",
                "down"
              ]
            },
            "type": "object",
            "title": "Thumbs"
          },
          "reasons": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "title": "Reasons"
          },
          "omitted_first_reason": {
            "type": "string",
            "maxLength": 140,
            "title": "Omitted First Reason",
            "default": ""
          },
          "clarity": {
            "anyOf": [
              {
                "type": "integer",
                "maximum": 5.0,
                "minimum": 1.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Clarity"
          },
          "note": {
            "type": "string",
            "maxLength": 140,
            "title": "Note",
            "default": ""
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "thumbs"
        ],
        "title": "Survey"
      },
      "ValidationError": {
