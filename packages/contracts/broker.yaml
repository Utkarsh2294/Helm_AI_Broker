              "medical",
              "duplicate",
              "referral",
              "injection"
            ],
            "title": "Scenario",
            "default": "happy"
          },
          "medical_released": {
            "type": "boolean",
            "title": "Medical Released",
            "default": false
          },
          "ranking_id": {
            "type": "string",
            "title": "Ranking Id",
            "default": ""
          },
          "selected": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 3,
            "title": "Selected"
          },
          "survey": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Survey"
              },
              {
                "type": "null"
              }
            ]
          },
