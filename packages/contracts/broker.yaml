            "anyOf": [
              {
                "type": "string",
                "maxLength": 20000
              },
              {
                "type": "null"
              }
            ],
            "title": "Suitability"
          },
          "pack_hash": {
            "type": "string",
            "title": "Pack Hash",
            "default": ""
          },
          "step_up_token": {
            "type": "string",
            "title": "Step Up Token",
