[project]
name = "helm-broker"
version = "0.1.0"
description = "Human-approved UK PMI broker workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26", "cryptography>=44,<47",
  "httpx>=0.28,<1", "arq>=0.26,<1", "tzdata>=2025,<2028"
]

[project.optional-dependencies]
agents = ["crewai>=1.8,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
