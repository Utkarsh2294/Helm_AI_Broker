name: Dependency security report
on: [push, pull_request]
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.6'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: apps/web
      - run: uv export --frozen --extra agents --no-dev --no-hashes --output-file requirements-audit.txt
      - name: Audit all shipped Python dependencies
        run: uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt -f json -o python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-dependency-audit, path: python-audit.json}
