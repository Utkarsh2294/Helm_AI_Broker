name: Dependency security report
on: [push, pull_request]
jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.6'}
      - run: uvx --python 3.12 semgrep==1.183.0 scan --config=p/ci --config=p/python --metrics=off --error services/api/app packages/engine/helm_engine
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.6'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: apps/web
      - run: uvx bandit==1.9.4 -r services/api/app -ll
      - run: uv export --frozen --extra agents --extra build --no-emit-package helm-engine --no-dev --no-hashes --output-file requirements-audit.txt
      - name: Audit all shipped Python dependencies
        run: uvx pip-audit --no-deps --disable-pip -r requirements-audit.txt -f json -o python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-dependency-audit, path: python-audit.json}
