name: Verify broker portal
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.6"}
      - run: uv sync --frozen --extra dev --extra agents
      - run: uv run ruff check services/api tools
      - run: uv run ruff format --check services/api
      - run: uv run python -m pytest -q
      - run: uv run python -m pytest packages/engine/tests -q
      - run: uv run alembic upgrade head
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: "10.20.0"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter helm-broker-web run lint
      - run: pnpm run format:check
      - run: pnpm --filter helm-broker-web run test:unit
      - run: node --test packages/engine/js/engine.test.mjs
      - run: pnpm exec spectral lint packages/contracts/core.yaml packages/contracts/broker.yaml
      - run: pnpm --filter helm-broker-web run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -p helmaibroker build --no-cache
      - name: Scan the built API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: helmaibroker-api:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
