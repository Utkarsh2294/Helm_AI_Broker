services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helm_broker
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helm_local_demo_only}
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["broker_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm -d helm_broker"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56389:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["broker_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      HELM_DATABASE_URL: postgresql+psycopg://helm:${POSTGRES_PASSWORD:-helm_local_demo_only}@postgres/helm_broker
      HELM_AGENT_RUNTIME: crewai
      HELM_ALLOWED_ORIGIN: http://127.0.0.1:5180
      HELM_REDIS_URL: redis://redis:6379/0
      HELM_CORE_API_URL: http://mock-core:8011
      HELM_CORE_DELIVERY_ENABLED: "true"
      HELM_ENCRYPTION_KEY: ${HELM_ENCRYPTION_KEY:-}
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8010"]
    ports: ["127.0.0.1:8010:8010"]
    volumes: ["broker_keys:/app/.runtime"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/v1/health')"]
      interval: 10s
      start_period: 120s
      retries: 20
  worker:
    build: .
    environment:
      HELM_DATABASE_URL: postgresql+psycopg://helm:${POSTGRES_PASSWORD:-helm_local_demo_only}@postgres/helm_broker
      HELM_ENCRYPTION_KEY: ${HELM_ENCRYPTION_KEY:-}
      HELM_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    volumes: ["broker_keys:/app/.runtime"]
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
  mock-core:
    build: .
    command: ["python", "-m", "uvicorn", "tools.mock_core:app", "--host", "0.0.0.0", "--port", "8011"]
    ports: ["127.0.0.1:8011:8011"]
  web:
    build: {context: apps/web}
    environment:
      HELM_API_PROXY: http://api:8010
    ports: ["127.0.0.1:5180:5180"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  broker_postgres:
  broker_redis:
  broker_keys:
